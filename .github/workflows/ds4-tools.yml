name: ds4 tools

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # ds4-check re-applies the patch series with `git am` inside pristine
    # clones. Git refuses to create those commits without a committer identity,
    # and GitHub-hosted runners ship no user.name/user.email configuration.
    env:
      GIT_COMMITTER_NAME: "github-actions[bot]"
      GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
    steps:
      - name: Check out satyrn-agent
        uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Bash syntax checks
        run: |
          for file in tools/*.bash tests/ds4_test_helpers.bash tests/ds4_*_test.bash; do
            bash -n "$file"
          done

      - name: Run shell suite
        run: bash tests/ds4_tools_test.bash

      - name: Check out ds4-py at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: rochecompaan/ds4-py
          ref: f0e2118629c315e835435c82c973638e6f9e49bc
          path: .ds4/ds4-py

      - name: Install ds4-py environment
        run: uv sync --project .ds4/ds4-py --python 3.14

      - name: Build each checked tree with ds4-py (CPU backend)
        run: |
          export PATH="$PWD/.ds4/ds4-py/.venv/bin:$PATH"
          bash tools/ds4-check.bash --build
