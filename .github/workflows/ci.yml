name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out satyrn-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install devenv
        run: >-
          nix profile add --accept-flake-config
          "github:NixOS/nixpkgs/8edc0c72e3a38faf5434e40d1f19431125fe4b30#devenv"

      - name: Run quality gate
        run: devenv shell -- uv run --frozen prek run --all-files --show-diff-on-failure

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out satyrn-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install devenv
        run: >-
          nix profile add --accept-flake-config
          "github:NixOS/nixpkgs/8edc0c72e3a38faf5434e40d1f19431125fe4b30#devenv"

      - name: Run portable Python tests
        run: devenv shell -- uv run --frozen pytest tests/unit tests/abnormal -q

      - name: Build wheel
        run: devenv shell -- uv build --wheel
