<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Customers</title>
  </head>
  <body>
    <main>
      <h1>Customers</h1>
      <p><a href="{% url 'crm:customer_create' %}">Add a customer</a></p>
      {% if customers %}
        <ul>
          {% for customer in customers %}
            <li>
              <a href="{% url 'crm:customer_detail' customer.id %}">
                {{ customer.first_name }} {{ customer.last_name }}
              </a>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p>No customers yet.</p>
      {% endif %}
    </main>
  </body>
</html>
